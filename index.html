<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a237e" />
    <meta
      name="description"
      content="אפליקציית ניהול קבוצת כדורשת"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      שתי הגנות על "האייקון פותח את הקבוצה הנכונה":

      1. שחזור מ-localStorage. אם הכתובת חסרת ?team= אבל יש קבוצה שמורה מביקור
         קודם — מוסיפים אותה מיד. זה מה שגרם לזה לעבוד באנדרואיד, שם ל-PWA
         מותקן יש אותו אחסון כמו לדפדפן.

      2. הפניית המניפסט ל-/api/manifest?team=X. הגנה 1 לבדה נכשלת באייפון:
         ל-web app שמותקן במסך הבית יש מאגר אחסון **נפרד לגמרי** מ-Safari, אז
         pwaTeam פשוט לא קיים שם והשחקנית נוחתת על דף המכירה (דווח 5.9.2026).
         מניפסט עם start_url שנושא את הקבוצה פותר את זה בשורש, כי הוא לא תלוי
         באחסון בכלל. חייב להיות כתובת http אמיתית — iOS לא קורא מניפסט
         מ-blob:/data:. ה-link קיים למעלה, לכן אפשר לעדכן אותו כאן.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var team = params.get("team");
          if (!team) {
            var saved = localStorage.getItem("pwaTeam");
            if (saved) {
              var sep = window.location.search ? "&" : "?";
              var newUrl = window.location.pathname + window.location.search + sep + "team=" + encodeURIComponent(saved) + window.location.hash;
              window.location.replace(newUrl);
              return; // הדף נטען מחדש עם ?team= — המניפסט יעודכן שם
            }
          }
          if (team) {
            var link = document.querySelector('link[rel="manifest"]');
            if (link) link.href = "/api/manifest?team=" + encodeURIComponent(team);
          }
        } catch (e) { /* אם משהו נכשל - ממשיכים רגיל לדף הנחיתה */ }
      })();
    </script>
    <title>קבוצת הכדורשת</title>
  </head>
  <body>
    <noscript>יש להפעיל JavaScript כדי להשתמש באפליקציה.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
