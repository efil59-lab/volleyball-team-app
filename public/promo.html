    /* The page the promo clip lives on: the clip, and one button into the trial.

       Made by scripts/make-promo.mjs (promo.mp4 + promo.jpg). */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: Heebo, "Segoe UI", Tahoma, Arial, sans-serif; color: #fff; background: linear-gradient(165deg, #2a36a8 0%, #1a237e 55%, #10164f 100%) fixed; display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
    h1 { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 4px 0 12px; text-align: center; }
    h1 b { color: #f5c842; }
    .frame { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; }
    video { height: 100%; max-height: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 24px; background: #10164f; box-shadow: 0 18px 44px rgba(0, 0, 0, .45); object-fit: cover; }
    .go { display: block; width: 100%; max-width: 420px; margin-top: 14px; background: #f5c842; color: #10163f; text-align: center; text-decoration: none; border-radius: 999px; padding: 16px 20px; font-size: 20px; font-weight: 800; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
    .go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .free { margin-top: 10px; font-size: 13.5px; opacity: .9; text-align: center; }
  </style>

  <div class="free">בלי כרטיס אשראי · בלי להתקין כלום · הקבוצה נפתחת מיד</div>
</body>
